name: Rodar Bot da NASA
on:
  schedule:
    - cron: '0 12 * * *' # Roda todo dia às 12:00 UTC (09:00 Brasília)
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Instalar Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Instalar Bibliotecas
        run: pip install requests
      - name: Rodar Script
        run: python nasabot.py
